name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test, build & puzzles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck & build
        run: npm run build

      # puzzles.json is generated from scripts/figures.ts; fail if they've drifted apart
      # (or if a figure no longer validates, which makes the script exit non-zero)
      - name: Puzzles are up to date
        run: |
          npm run puzzles
          git diff --exit-code src/data/puzzles.json || {
            echo "::error::src/data/puzzles.json is stale. Run 'npm run puzzles' and commit the result."
            exit 1
          }
